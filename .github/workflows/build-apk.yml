name: Build APK
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      app_name:
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ inputs.build_id }}
      APP_NAME: ${{ inputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f "builds/$BUILD_ID/project.zip" ]; then
            unzip -q "builds/$BUILD_ID/project.zip" -d src_unzip
            INDEX=$(find src_unzip -name index.html -not -path "*/node_modules/*" | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
            if [ -z "$INDEX" ]; then echo "No index.html found in zip"; exit 1; fi
            cp -r "$(dirname "$INDEX")"/. www/
          else
            cp "builds/$BUILD_ID/index.html" www/index.html
          fi
      - name: Build with Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "com.n8napk.b$BUILD_ID" --web-dir www
          npx cap add android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}
          name: ${{ inputs.app_name }} (build ${{ inputs.build_id }})
          files: app-debug.apk
